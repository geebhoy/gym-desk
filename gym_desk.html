<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
:root{--bg:#eef1ef;--card:#fff;--ink:#14211f;--mut:#5d6b68;--line:#d3dad7;--pri:#1f5c4d;--onpri:#fff;--tape:#f2c230;--bad:#b3261e;--ok:#1f7a4d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121917;--card:#1b2522;--ink:#e8efed;--mut:#93a39f;--line:#2e3b37;--pri:#4fb597;--onpri:#0c1412;--bad:#ff8a80;--ok:#6fd6a0}}
:root[data-theme="dark"]{--bg:#121917;--card:#1b2522;--ink:#e8efed;--mut:#93a39f;--line:#2e3b37;--pri:#4fb597;--onpri:#0c1412;--bad:#ff8a80;--ok:#6fd6a0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1,h2{font-family:"Barlow Condensed",Impact,sans-serif;margin:0;letter-spacing:.01em}
h1{font-size:34px;border-bottom:6px solid var(--tape);display:inline-block;padding-bottom:2px}
h2{font-size:22px;margin-bottom:8px}
nav{display:flex;gap:4px;margin:16px 0;flex-wrap:wrap}
nav button{flex:1;min-width:0;padding:12px 4px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 16px Barlow,sans-serif;border-radius:8px;cursor:pointer}
nav button[aria-selected=true]{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
label{display:block;font-size:14px;color:var(--mut);margin-bottom:3px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:10px}
.btn{padding:10px 16px;border:0;border-radius:8px;background:var(--pri);color:var(--onpri);font:600 16px Barlow,sans-serif;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--tape);outline-offset:1px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.item:first-of-type{border-top:0}
.sub{color:var(--mut);font-size:14px}
.tag{font-size:13px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.msg{color:var(--bad);font-weight:600;min-height:1.4em;margin-top:8px}
input[aria-invalid=true]{border-color:var(--bad);border-width:2px}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn.alt.danger{color:var(--bad);border-color:var(--bad)}
.br{display:grid;grid-template-columns:76px 1fr 72px;gap:8px;align-items:center;margin:5px 0}
.br b{text-align:right;font-weight:600}
.bt{background:var(--line);border-radius:4px;height:16px;overflow:hidden}
.bf{background:var(--pri);height:100%;min-width:2px;border-radius:4px}
.qr{background:#fff;padding:8px;border-radius:8px;width:220px;max-width:100%;margin:8px auto}
.qr svg{display:block;width:100%;height:auto}
a.btn{text-decoration:none;display:inline-block}
.empty{color:var(--mut);padding:6px 0}
.stat{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.stat div{flex:1;min-width:120px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stat b{font:700 30px "Barlow Condensed",sans-serif;display:block}
</style>
</head>
<body>
<main>
<h1>Gym Desk</h1>
<div id="st" class="sub" role="status" style="margin-top:8px">Connecting…</div>
<nav role="tablist" id="tabs"></nav>
<div id="view"></div>
</main>
<script>
const KEY='gymdesk-v1';
let db={members:[],payments:[],visits:[],plans:[]};
try{const s=localStorage.getItem(KEY);if(s)db=JSON.parse(s)}catch(e){}
db.plans=db.plans||[];
const localCopy=JSON.parse(JSON.stringify(db));
const save=()=>{if(live){sync();return}try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const COLS={members:'gym-members',payments:'gym-payments',visits:'gym-visits',plans:'gym-plans'};
let live=null,pending=0,dirty=false,q2=Promise.resolve(),got={},synced={members:{},payments:{},visits:{},plans:{}};
const BAD='<span class="bad">Could not save to the shared database. Check your connection and access, then reload.</span>';
const setSt=h=>{const e=document.getElementById('st');if(e)e.innerHTML=h};
function sync(){pending++;q2=q2.then(doSync).catch(()=>{}).then(()=>{pending--;if(pending===0&&dirty){dirty=false;refetch()}})}
async function doSync(){for(const k in COLS){const col=live.collection(COLS[k]),seen={};
 for(const it of db[k]||[]){seen[it.id]=1;const j=JSON.stringify(it);if(synced[k][it.id]!==j){try{await col.doc(it.id).set(it);synced[k][it.id]=j}catch(e){setSt(BAD)}}}
 for(const id of Object.keys(synced[k])){if(!seen[id]){try{await col.doc(id).delete();delete synced[k][id]}catch(e){setSt(BAD)}}}}}
function apply(k,docs){const arr=docs.map(d=>JSON.parse(JSON.stringify(d.data()))).sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);synced[k]={};arr.forEach(x=>synced[k][x.id]=JSON.stringify(x));db[k]=arr}
async function refetch(){try{for(const k in COLS){const s=await live.collection(COLS[k]).get();if(pending>0)return;apply(k,s.docs)}after()}catch(e){}}
function after(){if(Object.keys(got).length===4){const empty=!db.members.length&&!db.payments.length&&!db.visits.length&&!db.plans.length,n=localCopy.members.length;
 setSt('<span class="ok">Live: shared with everyone you give access to.</span>'+(empty&&n?` This browser has ${n} saved member${n>1?'s':''}. <button class="btn" onclick="migrate()">Move them to the shared database</button>`:''))}
 render(true)}
function migrate(){for(const k in COLS)db[k]=JSON.parse(JSON.stringify(localCopy[k]||[]));save();render()}
function goLive(d){live=d;setSt('Connecting…');for(const k in COLS){live.collection(COLS[k]).onSnapshot(s=>{if(pending>0){dirty=true;return}apply(k,s.docs);got[k]=1;after()},()=>setSt('<span class="bad">Live connection lost. Reload the page.</span>'))}}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const addMonths=(ds,n)=>{const[y,m,d]=ds.split('-').map(Number);const t=new Date(Date.UTC(y,m-1+n,1));const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(d,last));return t.toISOString().slice(0,10)};
const fmtT=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const money=n=>Number(n).toLocaleString();
const mem=id=>db.members.find(m=>m.id===id);
const active=m=>m.expires&&m.expires>=today();
const open=m=>db.visits.find(v=>v.mid===m.id&&!v.out);
const status=m=>active(m)?`<span class="tag ok">Paid until ${m.expires}</span>`:`<span class="tag bad">${m.expires?'Expired '+m.expires:'No payment yet'}</span>`;
let tab='in',q='';
const tabs=[['in','Check-in'],['members','Members'],['pay','Payments'],['rep','Reports']];
function render(keep){let vals=null,fid=null,sel=null;
 if(keep){vals={};document.querySelectorAll('#view input,#view select').forEach(e=>{if(e.id&&e.type!=='file')vals[e.id]=e.value});const a=document.activeElement;if(a&&a.id){fid=a.id;try{sel=[a.selectionStart,a.selectionEnd]}catch(x){}}}
 render0();
 if(scanStream){const v=document.getElementById('vid');if(v){v.srcObject=scanStream;v.style.display='block';v.play().catch(()=>{})}}
 if(vals){for(const id in vals){const e=document.getElementById(id);if(e)e.value=vals[id]}const f=fid&&document.getElementById(fid);if(f){f.focus();try{if(sel)f.setSelectionRange(sel[0],sel[1])}catch(x){}}}}
function render0(){
 $('tabs').innerHTML=tabs.map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" data-t="${k}">${l}</button>`).join('');
 $('view').innerHTML=tab==='in'?vIn():tab==='members'?vMem():tab==='rep'?vRep():vPay();
}
$('tabs').onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;q='';pend=null;pin=null;ed=null;rest=null;qrOpen=null;otp=null;stopScan();render()}};
function vIn(){
 const inside=db.visits.filter(v=>!v.out);
 const todayN=db.visits.filter(v=>new Date(v.in).toISOString().slice(0,10)===today()).length;
 const hits=q?db.members.filter(m=>(m.name+m.phone+(m.email||'')).toLowerCase().includes(q.toLowerCase())):[];
 return `<div class="stat"><div><b>${inside.length}</b>inside now</div><div><b>${todayN}</b>visits today</div></div>
 <div class="card"><h2>Scan or enter member code</h2><div class="acts"><input id="cc" placeholder="Member code" autocomplete="off" autocapitalize="characters" style="flex:1;min-width:140px" onkeydown="if(event.key==='Enter')byCode()"><button class="btn" onclick="byCode()">Go</button><button class="btn alt" onclick="scan()">Scan QR</button></div><video id="vid" playsinline muted style="display:none;width:100%;max-height:300px;margin-top:10px;border-radius:8px;background:#000"></video><div class="msg" id="cmsg" role="alert"></div><div id="cok" class="ok" role="status" style="font-weight:600"></div></div>
 <div class="card"><h2>Find member</h2><label for="q">Name, phone or email</label><input id="q" value="${esc(q)}" oninput="q=this.value;keep()" autocomplete="off">
 <div id="hits">${hitsHtml(hits)}</div></div>
 <div class="card"><h2>Inside now</h2>${inside.length?inside.map(v=>{const m=mem(v.mid);return m?`<div class="item"><div>${esc(m.name)}<div class="sub">In at ${fmtT(v.in)}</div></div><button class="btn" onclick="out('${v.id}')">Check out</button></div>`:''}).join(''):'<div class="empty">Nobody is checked in.</div>'}</div>
 <div class="card"><h2>Today's log</h2>${db.visits.filter(v=>new Date(v.in).toISOString().slice(0,10)===today()).reverse().map(v=>{const m=mem(v.mid);return m?`<div class="item"><span>${esc(m.name)}</span><span class="sub">${fmtT(v.in)} – ${v.out?fmtT(v.out):'still in'}</span></div>`:''}).join('')||'<div class="empty">No visits yet today.</div>'}</div>`;
}
function hitsHtml(h){
 if(!q)return '';
 if(!h.length)return '<div class="empty">No match. Add them under Members.</div>';
 return h.map(m=>`<div class="item"><div>${esc(m.name)}<div class="sub">${esc(m.phone)}${m.email?" · "+esc(m.email):""}</div>${status(m)}</div>${open(m)?`<button class="btn alt" onclick="out('${open(m).id}')">Check out</button>`:(pin===m.id?`<div class="acts"><span class="bad">No active payment.</span><button class="btn" onclick="inn('${m.id}',true)">Check in anyway</button><button class="btn alt" onclick="innNo()">Cancel</button></div>`:(otp&&otp.mid===m.id?otpPanel(m):`<div class="acts"><button class="btn" onclick="inn('${m.id}')">Check in</button><button class="btn alt" onclick="startOtp('${m.id}')">Verify by code</button></div>`))}</div>`).join('');
}
function keep(){$('hits').innerHTML=hitsHtml(q?db.members.filter(m=>(m.name+m.phone+(m.email||'')).toLowerCase().includes(q.toLowerCase())):[])}
function inn(id,force){const m=mem(id);if(!m)return;if(!active(m)&&!force){pin=id;keep();return}pin=null;db.visits.push({id:uid(),mid:id,in:Date.now(),out:null});save();q='';render()}
function innNo(){pin=null;keep()}
function out(id){const v=db.visits.find(x=>x.id===id);v.out=Date.now();save();render()}
let ms='',ed=null,rest=null;
const addDays=(ds,n)=>{const d=new Date(ds+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const contact=m=>esc(m.phone)+(m.email?' · '+esc(m.email):'');
function soonHtml(){const t=today(),l=db.members.filter(m=>m.expires&&m.expires<=addDays(t,7)).sort((a,b)=>a.expires<b.expires?-1:1);
 return l.length?l.map(m=>{const x=m.expires<t;return `<div class="item"><div>${esc(m.name)}<div class="sub">${contact(m)}</div></div><span class="tag ${x?'bad':'ok'}">${x?'Expired ':'Ends '}${m.expires}</span></div>`}).join(''):'<div class="empty">Nobody is expired or ending in the next 7 days.</div>'}
function memList(){
 const l=db.members.filter(m=>(m.name+m.phone+(m.email||'')).toLowerCase().includes(ms.toLowerCase().trim()));
 if(!db.members.length)return '<div class="empty">No members yet. Add the first one above.</div>';
 if(!l.length)return '<div class="empty">No member matches your search.</div>';
 return l.map(m=>ed===m.id?`<div class="item" style="display:block"><div class="row"><div><label for="en">Full name</label><input id="en" value="${esc(m.name)}"></div><div><label for="ep">Phone</label><input id="ep" value="${esc(m.phone)}"></div><div><label for="ee">Email</label><input id="ee" value="${esc(m.email||'')}"></div><div><label for="ex">Paid until</label><input id="ex" type="date" value="${m.expires||''}"></div></div><div class="acts"><button class="btn" onclick="saveE('${m.id}')">Save</button><button class="btn alt" onclick="ed=null;render()">Cancel</button></div><div class="msg" id="emsg" role="alert"></div></div>`
 :`<div class="item"><div>${esc(m.name)}<div class="sub">${contact(m)}</div></div><div class="acts">${status(m)}${pend===m.id?`<span class="sub">Delete ${esc(m.name)}? Payments stay; check-in log is removed.</span><button class="btn alt danger" onclick="delYes('${m.id}')">Yes, delete</button><button class="btn alt" onclick="delNo()">Cancel</button>`:`${m.code?`<button class="btn alt" onclick="qrOpen=qrOpen==='${m.id}'?null:'${m.id}';render()">QR</button>`:''}<button class="btn alt" onclick="ed='${m.id}';pend=null;render()">Edit</button><button class="btn alt danger" onclick="delM('${m.id}')">Delete</button>`}</div>${qrOpen===m.id&&m.code?qrPanel(m):''}</div>`).join('')}
function vMem(){
 return `<div class="card"><h2>Add member</h2><div class="row"><div><label for="n">Full name</label><input id="n"></div><div><label for="p">Phone</label><input id="p" type="tel"></div><div><label for="e">Email</label><input id="e" type="email" autocomplete="off"></div></div><button class="btn" onclick="addM()">Add member</button><div class="msg" id="msg" role="alert"></div></div>
 ${db.members.some(m=>!m.code)?`<div class="card"><b>${db.members.filter(m=>!m.code).length}</b> member(s) have no check-in code yet. <button class="btn" onclick="makeCodes()">Create member codes</button></div>`:''}
 <div class="card"><h2>Expired or ending within 7 days</h2>${soonHtml()}</div>
 <div class="card"><h2>All members (${db.members.length})</h2><label for="ms">Search</label><input id="ms" value="${esc(ms)}" oninput="ms=this.value;$('ml').innerHTML=memList()" autocomplete="off" style="margin-bottom:8px"><div id="ml">${memList()}</div></div>
 <div class="card"><h2>Backup</h2><div class="acts"><button class="btn" onclick="backup()">Save backup file</button><label class="btn alt" style="margin:0;cursor:pointer;color:var(--ink)">Restore from file<input type="file" id="rf" accept=".json,application/json" onchange="pick(this)" style="display:none"></label></div><div id="bk" class="sub" role="status" style="margin-top:8px"></div></div>`;
}
function saveE(id){const m=mem(id),n=$('en').value.trim(),p=$('ep').value.trim(),e=$('ee').value.trim(),x=$('ex').value,B='emsg';
 const nm=v=>v.toLowerCase().replace(/\s+/g,' ').trim();
 if(!n)return fail('en','Full name is required.',B);
 if(db.members.some(o=>o.id!==id&&nm(o.name)===nm(n)))return fail('en','Someone already uses the name "'+n+'".',B);
 if(!p)return fail('ep','Phone is required.',B);
 if(!e)return fail('ee','Email is required.',B);
 if(!/^\S+@\S+\.\S+$/.test(e))return fail('ee','Enter a valid email address.',B);
 m.name=n;m.phone=p;m.email=e;m.expires=x||null;ed=null;save();render()}
async function backup(){const b=$('bk');let d=null;try{d=window.claude?await claude.use('downloads'):null}catch(e){}
 if(!d){b.textContent='Saving files is not available in this view.';return}
 try{await d.save({filename:'gym-desk-backup-'+today()+'.json',data:JSON.stringify(db,null,1)});b.textContent='Backup ready.'}catch(e){b.textContent=e&&e.code==='declined'?'Backup cancelled.':'Could not save the backup.'}}
function pick(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(![o.members,o.payments,o.visits].every(Array.isArray))throw 0;rest=o;$('bk').innerHTML=`This backup has ${o.members.length} members, ${o.payments.length} payments and ${o.visits.length} visits. Restoring replaces everything now in the app. <button class="btn" onclick="doRest()">Yes, restore</button> <button class="btn alt" onclick="rest=null;render()">Cancel</button>`}catch(e){$('bk').textContent='That file is not a Gym Desk backup.'}};r.readAsText(f)}
function doRest(){db={members:rest.members,payments:rest.payments,visits:rest.visits,plans:Array.isArray(rest.plans)?rest.plans:[]};rest=null;save();render()}
function fail(id,t,box){$(box||'msg').textContent=t;const f=$(id);f.setAttribute('aria-invalid','true');f.focus();return false}
document.addEventListener('input',e=>{const t=e.target;t.removeAttribute('aria-invalid');document.querySelectorAll('.msg').forEach(x=>x.textContent='');if(t.id==='pn'&&t.value!==''&&+t.value>12)fail('pn','Months paid can be 12 at most. You entered '+t.value+'.')});
let pend=null,pin=null;
function delM(id){pend=id;render()}
function delNo(){pend=null;render()}
function delYes(id){const m=mem(id);if(!m)return;
 db.payments.forEach(p=>{if(p.mid===id)p.name=m.name});
 db.visits=db.visits.filter(v=>v.mid!==id);
 db.members=db.members.filter(x=>x.id!==id);pend=null;save();render()}
function addM(){const n=$('n').value.trim(),p=$('p').value.trim(),e=$('e').value.trim();
 if(!n)return fail('n','Full name is required.');
 const nm=x=>x.toLowerCase().replace(/\s+/g,' ').trim();
 if(db.members.some(m=>nm(m.name)===nm(n)))return fail('n','Someone already uses the name "'+n+'". Use a different name, or add a detail such as a middle initial.');
 if(!p)return fail('p','Phone is required.');
 if(!e)return fail('e','Email is required.');
 if(!/^\S+@\S+\.\S+$/.test(e))return fail('e','Enter a valid email address.');
 db.members.push({id:uid(),name:n,phone:p,email:e,code:newCode(),expires:null});save();render()}
function vPay(){
 const mo=today().slice(0,7);
 const tot=db.payments.filter(p=>p.date.slice(0,7)===mo).reduce((s,p)=>s+p.amount,0);
 return `<div class="stat"><div><b>${money(tot)}</b>collected this month</div><div><b>${db.members.filter(active).length}</b>active members</div></div>
 <div class="card"><h2>Record payment</h2>${db.members.length?`<div class="row"><div><label for="pm">Member</label><select id="pm">${db.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div>
 <div><label for="pl">Plan</label><select id="pl" onchange="usePlan(this.value)"><option value="">Custom</option>${db.plans.map(p=>`<option value="${p.id}">${esc(p.name)} (${p.months} mo, ${money(p.price)})</option>`).join('')}</select></div><div><label for="pa">Amount</label><input id="pa" type="number" min="0"></div>
 <div><label for="pn">Months paid</label><input id="pn" type="number" min="1" max="12" step="1" value="1"></div>
 <div><label for="pd">Membership starts</label><input id="pd" type="date" value="${today()}"></div><div><label for="py">Method</label><select id="py"><option>Cash</option><option>Transfer</option><option>Card</option></select></div></div>
 <button class="btn" onclick="addP()">Save payment</button><div class="msg" id="msg" role="alert"></div>`:'<div class="empty">Add a member first.</div>'}</div>
 <div class="card"><h2>Plans</h2><div class="row"><div><label for="ln">Plan name</label><input id="ln"></div><div><label for="lm">Months (1 to 12)</label><input id="lm" type="number" min="1" max="12" step="1"></div><div><label for="lp">Price</label><input id="lp" type="number" min="0"></div></div><button class="btn" onclick="addPlan()">Add plan</button><div class="msg" id="pmsg" role="alert"></div>${db.plans.length?db.plans.map(p=>`<div class="item"><div>${esc(p.name)}<div class="sub">${p.months} month${p.months>1?'s':''} · ${money(p.price)}</div></div><button class="btn alt danger" onclick="delPlan('${p.id}')">Delete</button></div>`).join(''):'<div class="empty">No plans yet. Add one to fill in amounts automatically.</div>'}</div>
 <div class="card"><h2>History</h2>${db.payments.length?[...db.payments].reverse().map(p=>{const m=mem(p.mid);return `<div class="item"><div>${esc(m?m.name:(p.name?p.name+' (deleted)':'Deleted member'))}<div class="sub">${p.plan?esc(p.plan)+' · ':''}${p.date} · ${p.method} · ${p.months} mo${p.from&&p.from!==p.date?' · starts '+p.from:''}</div></div><b>${money(p.amount)}</b></div>`}).join(''):'<div class="empty">No payments recorded.</div>'}</div>`;
}
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dkey=t=>{const d=new Date(t);return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const hr=h=>(h%12||12)+' '+(h<12?'AM':'PM');
function bars(list,fmt){const mx=Math.max(1,...list.map(x=>x.v));return list.map(x=>`<div class="br"><span class="sub">${esc(x.l)}</span><div class="bt"><div class="bf" style="width:${x.v/mx*100}%"></div></div><b>${fmt?fmt(x.v):x.v}</b></div>`).join('')}
function vRep(){
 const t=today(),[y,mo]=t.split('-').map(Number);
 const months=[];for(let i=5;i>=0;i--){const d=new Date(Date.UTC(y,mo-1-i,1)),k=d.toISOString().slice(0,7);months.push({l:MN[d.getUTCMonth()]+' '+String(d.getUTCFullYear()).slice(2),v:db.payments.filter(p=>p.date.slice(0,7)===k).reduce((a,p)=>a+p.amount,0)})}
 const days=[];for(let i=13;i>=0;i--){const ds=addDays(t,-i);days.push({l:new Date(ds+'T12:00:00').toLocaleDateString([],{weekday:'short',day:'numeric'}),v:db.visits.filter(x=>dkey(x.in)===ds).length})}
 const hc=Array(24).fill(0);db.visits.forEach(v=>hc[new Date(v.in).getHours()]++);
 const used=hc.map((c,h)=>c?h:-1).filter(h=>h>=0),hours=used.length?hc.map((c,h)=>({l:hr(h),v:c})).slice(used[0],used[used.length-1]+1):[];
 const peak=hc.indexOf(Math.max(...hc));
 const done=db.visits.filter(v=>v.out),avg=done.length?done.reduce((a,v)=>a+(v.out-v.in),0)/done.length/6e4:0;
 const thisM=months[5].v,v14=days.reduce((a,x)=>a+x.v,0);
 return `<div class="stat"><div><b>${money(thisM)}</b>income this month</div><div><b>${v14}</b>visits, last 14 days</div><div><b>${done.length?(avg<60?Math.round(avg)+' min':(avg/60).toFixed(1)+' h'):'-'}</b>average visit</div></div>
 <div class="card"><h2>Income by month</h2>${db.payments.length?bars(months,money):'<div class="empty">No payments recorded yet.</div>'}</div>
 <div class="card"><h2>Visits per day</h2>${db.visits.length?bars(days):'<div class="empty">No visits recorded yet.</div>'}</div>
 <div class="card"><h2>Busiest hours</h2>${hours.length?`<div class="sub" style="margin-bottom:6px">Peak: ${hr(peak)} (${hc[peak]} visit${hc[peak]>1?'s':''}, all time)</div>`+bars(hours):'<div class="empty">No visits recorded yet.</div>'}</div>`}
let qrOpen=null,otp=null,scanStream=null,scanTimer=null;
const CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const rnd=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n;
function newCode(){let c;do{c='';for(let i=0;i<6;i++)c+=CH[rnd(CH.length)]}while(db.members.some(m=>m.code===c));return c}
const normCode=v=>String(v).toUpperCase().replace(/[^A-Z0-9]/g,'');
function makeCodes(){db.members.forEach(m=>{if(!m.code)m.code=newCode()});save();render()}
function qrSvg(t){try{const q=qrcode(0,'M');q.addData(t);q.make();const n=q.getModuleCount(),b=2;let d='';
 for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+b},${r+b}h1v1h-1z`;
 return `<svg viewBox="0 0 ${n+2*b} ${n+2*b}" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`}catch(e){return '<div class="bad">The QR library did not load. Reload the page.</div>'}}
function qrPanel(m){return `<div style="width:100%;text-align:center"><div class="qr">${qrSvg(m.code)}</div><b style="font:700 30px 'Barlow Condensed',sans-serif;letter-spacing:.12em">${m.code}</b><div class="sub">${esc(m.name)} · show this at the front desk</div><button class="btn alt" style="margin-top:8px" onclick="qrOpen=null;render()">Close</button></div>`}
function flash(t){const e=document.getElementById('cok');if(e)e.textContent=t;const c=document.getElementById('cc');if(c)c.focus()}
function byCode(src){const c=normCode(src||$('cc').value);
 if(!c)return fail('cc','Enter or scan a member code.','cmsg');
 const m=db.members.find(x=>x.code===c);
 if(!m)return fail('cc','No member has the code '+c+'.','cmsg');
 const v=open(m);if(v){out(v.id);flash(m.name+' checked out.');return}
 if(!active(m)){q=m.name;pin=m.id;render();return}
 inn(m.id,true);flash(m.name+' checked in.')}
async function scan(){if(scanStream){stopScan();return}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return fail('cc','Camera scanning is not available here. Type the code instead.','cmsg');
 try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){return fail('cc','Camera is blocked. Allow camera access, or type the code instead.','cmsg')}
 const v=$('vid');v.srcObject=scanStream;v.style.display='block';try{await v.play()}catch(e){}
 const det=window.BarcodeDetector?new BarcodeDetector({formats:['qr_code']}):null,cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
 scanTimer=setInterval(async()=>{const vv=document.getElementById('vid');if(!vv||vv.readyState<2)return;let txt=null;
  try{if(det){const r=await det.detect(vv);if(r.length)txt=r[0].rawValue}
   else if(window.jsQR){cv.width=vv.videoWidth;cv.height=vv.videoHeight;cx.drawImage(vv,0,0);const im=cx.getImageData(0,0,cv.width,cv.height),r=jsQR(im.data,im.width,im.height);if(r)txt=r.data}}catch(e){}
  if(txt){stopScan();byCode(txt)}},400)}
function stopScan(){clearInterval(scanTimer);if(scanStream)scanStream.getTracks().forEach(t=>t.stop());scanStream=null;const v=document.getElementById('vid');if(v){v.srcObject=null;v.style.display='none'}}
function startOtp(id){otp={mid:id,code:String(rnd(1e6)).padStart(6,'0'),exp:Date.now()+3e5,tries:0};keep()}
function otpPanel(m){const msg='Your Gym Desk check-in code is '+otp.code+'. It is valid for 5 minutes.',ph=(m.phone||'').replace(/[^\d+]/g,'');
 const sms=ph?`<a class="btn alt" href="sms:${ph}?&body=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Send by SMS</a>`:'',em=m.email?`<a class="btn alt" href="mailto:${esc(m.email)}?subject=${encodeURIComponent('Gym check-in code')}&body=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Send by email</a>`:'';
 return `<div style="width:100%"><div class="sub">Send the code to ${esc(m.name)}, then enter the 6 digits they read back. Valid 5 minutes.</div><div class="acts" style="margin:8px 0">${sms}${em}</div><div class="acts"><input id="oc" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="off" style="width:150px" onkeydown="if(event.key==='Enter')checkOtp()"><button class="btn" onclick="checkOtp()">Verify</button><button class="btn alt" onclick="otp=null;keep()">Cancel</button></div><div class="msg" id="omsg" role="alert"></div></div>`}
function otpEnd(t){otp=null;keep();document.getElementById('hits').insertAdjacentHTML('afterbegin','<div class="msg">'+t+'</div>')}
function checkOtp(){if(!otp)return;const m=mem(otp.mid),v=$('oc').value.trim();
 if(Date.now()>otp.exp)return otpEnd('That code expired. Start again.');
 if(!/^\d{6}$/.test(v))return fail('oc','Enter the 6-digit code.','omsg');
 if(v!==otp.code){otp.tries++;if(otp.tries>=3)return otpEnd('Too many wrong codes. Start again.');const l=3-otp.tries;return fail('oc','Wrong code. '+l+' attempt'+(l>1?'s':'')+' left.','omsg')}
 otp=null;const o=open(m);if(o){out(o.id)}else if(!active(m)){pin=m.id;keep()}else inn(m.id,true)}
function usePlan(id){const pl=db.plans.find(x=>x.id===id);if(!pl)return;$('pa').value=pl.price;$('pn').value=pl.months}
function delPlan(id){db.plans=db.plans.filter(x=>x.id!==id);save();render()}
function addPlan(){const B='pmsg',n=$('ln').value.trim(),mr=$('lm').value.trim(),m=Number(mr),pr=$('lp').value.trim(),price=parseFloat(pr);
 const nm=v=>v.toLowerCase().replace(/\s+/g,' ').trim();
 if(!n)return fail('ln','Plan name is required.',B);
 if(db.plans.some(x=>nm(x.name)===nm(n)))return fail('ln','A plan named "'+n+'" already exists.',B);
 if(mr==='')return fail('lm','Months is required.',B);
 if(!Number.isInteger(m))return fail('lm','Months must be a whole number.',B);
 if(m>12)return fail('lm','Months can be 12 at most. You entered '+m+'.',B);
 if(m<1)return fail('lm','Months must be at least 1.',B);
 if(pr==='')return fail('lp','Price is required.',B);
 if(!(price>0))return fail('lp','Price must be more than 0.',B);
 db.plans.push({id:uid(),name:n,months:m,price});save();render()}
function addP(){
 const ar=$('pa').value.trim(),a=parseFloat(ar);
 if(ar==='')return fail('pa','Amount is required.');
 if(!(a>0))return fail('pa','Amount must be more than 0.');
 const nr=$('pn').value.trim(),n=Number(nr);
 if(nr==='')return fail('pn','Months paid is required.');
 if(!Number.isInteger(n))return fail('pn','Months paid must be a whole number.');
 if(n>12)return fail('pn','Months paid can be 12 at most. You entered '+n+'.');
 if(n<1)return fail('pn','Months paid must be at least 1.');
 const st=$('pd').value;
 if(!st)return fail('pd','Start date is required.');
 const m=mem($('pm').value);
 const from=(m.expires&&m.expires>st)?m.expires:st;
 m.expires=addMonths(from,n);
 db.payments.push({id:uid(),mid:m.id,amount:a,method:$('py').value,months:n,date:today(),from:st,plan:(db.plans.find(x=>x.id===$('pl').value)||{}).name||''});
 save();render();
}
render();
(async()=>{let d=null;try{d=window.claude?await claude.use('db'):null}catch(e){}
 if(d)goLive(d);else setSt('Not live: data stays in this browser only. Open the shared link while signed in to claude.ai.')})();
</script>
