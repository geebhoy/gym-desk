
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Desk</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #eef1ef;
    --card: #fff;
    --ink: #14211f;
    --mut: #5d6b68;
    --line: #d3dad7;
    --pri: #1f5c4d;
    --onpri: #fff;
    --tape: #f2c230;
    --bad: #b3261e;
    --ok: #1f7a4d;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bg: #121917;
        --card: #1b2522;
        --ink: #e8efed;
        --mut: #93a39f;
        --line: #2e3b37;
        --pri: #4fb597;
        --onpri: #0c1412;
        --bad: #ff8a80;
        --ok: #6fd6a0;
    }
}

:root[data-theme="dark"] {
    --bg: #121917;
    --card: #1b2522;
    --ink: #e8efed;
    --mut: #93a39f;
    --line: #2e3b37;
    --pri: #4fb597;
    --onpri: #0c1412;
    --bad: #ff8a80;
    --ok: #6fd6a0;
}

html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }

body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 Barlow, system-ui, sans-serif;
}

main { max-width: 760px; margin: 0 auto; padding: 16px; }

h1, h2 {
    font-family: "Barlow Condensed", Impact, sans-serif;
    margin: 0;
    letter-spacing: .01em;
}

h1 {
    font-size: 34px;
    border-bottom: 6px solid var(--tape);
    display: inline-block;
    padding-bottom: 2px;
}

h2 { font-size: 22px; margin-bottom: 8px; }

nav {
    display: flex;
    gap: 4px;
    margin: 16px 0;
    flex-wrap: wrap;
}

nav button {
    flex: 1;
    min-width: 0;
    padding: 12px 4px;
    border: 2px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font: 600 16px Barlow, sans-serif;
    border-radius: 8px;
    cursor: pointer;
}

nav button[aria-selected=true] {
    background: var(--pri);
    color: var(--onpri);
    border-color: var(--pri);
}

.card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
}

input, select {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    color: var(--ink);
    font: inherit;
}

label {
    display: block;
    font-size: 14px;
    color: var(--mut);
    margin-bottom: 3px;
}

.row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
    margin-bottom: 10px;
}

.btn {
    padding: 10px 16px;
    border: 0;
    border-radius: 8px;
    background: var(--pri);
    color: var(--onpri);
    font: 600 16px Barlow, sans-serif;
    cursor: pointer;
}

.btn.alt {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
}

button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 3px solid var(--tape);
    outline-offset: 1px;
}

.item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-top: 1px solid var(--line);
    flex-wrap: wrap;
}

.item:first-of-type { border-top: 0; }
.sub { color: var(--mut); font-size: 14px; }

.tag {
    font-size: 13px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 99px;
    border: 1px solid currentColor;
}

.ok { color: var(--ok); }
.bad { color: var(--bad); }

.msg {
    color: var(--bad);
    font-weight: 600;
    min-height: 1.4em;
    margin-top: 8px;
}

input[aria-invalid=true] { border-color: var(--bad); border-width: 2px; }

.acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.btn.alt.danger { color: var(--bad); border-color: var(--bad); }

.br {
    display: grid;
    grid-template-columns: 76px 1fr 72px;
    gap: 8px;
    align-items: center;
    margin: 5px 0;
}

.br b { text-align: right; font-weight: 600; }

.bt { background: var(--line); border-radius: 4px; height: 16px; overflow: hidden; }
.bf { background: var(--pri); height: 100%; min-width: 2px; border-radius: 4px; }

.qr {
    background: #fff;
    padding: 8px;
    border-radius: 8px;
    width: 220px;
    max-width: 100%;
    margin: 8px auto;
}

.qr svg { display: block; width: 100%; height: auto; }

a.btn { text-decoration: none; display: inline-block; }
.empty { color: var(--mut); padding: 6px 0; }

.stat { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }

.stat div {
    flex: 1;
    min-width: 120px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
}

.stat b {
    font: 700 30px "Barlow Condensed", sans-serif;
    display: block;
}
</style>
</head>

<body>
<main>
    <h1>Gym Desk</h1>
    <div id="st" class="sub" role="status" style="margin-top:8px">Loading Gym Desk...</div>
    <nav role="tablist" id="tabs"></nav>
    <div id="view"></div>
</main>

<script>
'use strict';

/* =========================================
   1. APPLICATION DATA AND FLASK CONNECTION
   ========================================= */

let db = {
    members: [],
    payments: [],
    visits: [],
    plans: []
};

let saveQueue = Promise.resolve();
let dataLoaded = false;

const $ = id => document.getElementById(id);

const setSt = message => {
    const element = $('st');
    if (element) element.textContent = message;
};

async function save() {
    if (!dataLoaded) {
        setSt('Please wait until Gym Desk finishes loading.');
        return;
    }

    // Capture this version of the data before queueing the request.
    const snapshot = JSON.stringify(db);

    saveQueue = saveQueue
        .catch(() => {})
        .then(async () => {
            try {
                const response = await fetch('/api/data', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: snapshot
                });

                if (!response.ok) {
                    const result = await response.json().catch(() => ({}));
                    throw new Error(result.error || 'The server could not save the data.');
                }

                setSt('Connected to Gym Desk. Changes saved.');
            } catch (error) {
                setSt('Could not save data. Check your connection and try again.');
                console.error('Gym Desk save error:', error);
                throw error;
            }
        });

    try {
        await saveQueue;
    } catch (error) {
        // The status message above explains the failure.
    }
}

async function loadData() {
    setSt('Loading Gym Desk data...');

    try {
        const response = await fetch('/api/data');

        if (!response.ok) {
            throw new Error('The server could not load Gym Desk data.');
        }

        const data = await response.json();

        for (const key of ['members', 'payments', 'visits', 'plans']) {
            if (!Array.isArray(data[key])) {
                throw new Error('The server returned invalid data for ' + key + '.');
            }
        }

        db = data;

        // Ensure every collection is present.
        db.plans = db.plans || [];

        dataLoaded = true;
        render();
        setSt('Connected to Gym Desk. Data loaded successfully.');
    } catch (error) {
        setSt('Could not load data. Check that Flask is running, then refresh.');
        console.error('Gym Desk loading error:', error);
    }
}

/* =========================================
   2. SHARED HELPERS
   ========================================= */

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
}[c]));

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

const today = () => {
    const d = new Date();
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000)
        .toISOString().slice(0, 10);
};

const addMonths = (ds, n) => {
    const [y, m, d] = ds.split('-').map(Number);
    const t = new Date(Date.UTC(y, m - 1 + n, 1));
    const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
    t.setUTCDate(Math.min(d, last));
    return t.toISOString().slice(0, 10);
};

const addDays = (ds, n) => {
    const d = new Date(ds + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
};

const fmtT = t => new Date(Number(t)).toLocaleTimeString([], {
    hour: '2-digit',
    minute: '2-digit'
});

const money = n => Number(n || 0).toLocaleString();

const mem = id => db.members.find(m => m.id === id);

const active = m => Boolean(m && m.expires && m.expires >= today());

const open = m => db.visits.find(v => v.mid === m.id && !v.out);

const status = m => active(m)
    ? `<span class="tag ok">Paid until ${esc(m.expires)}</span>`
    : `<span class="tag bad">${m.expires ? 'Expired ' + esc(m.expires) : 'No payment yet'}</span>`;

let tab = 'in';
let q = '';
let ms = '';
let ed = null;
let rest = null;
let pend = null;
let pin = null;
let otp = null;

const tabs = [
    ['in', 'Check-in'],
    ['members', 'Members'],
    ['pay', 'Payments'],
    ['rep', 'Reports']
];

/* =========================================
   3. NAVIGATION AND RENDERING
   ========================================= */

function render(keep) {
    let vals = null;
    let fid = null;
    let sel = null;

    if (keep) {
        vals = {};
        document.querySelectorAll('#view input, #view select').forEach(e => {
            if (e.id && e.type !== 'file') vals[e.id] = e.value;
        });

        const a = document.activeElement;

        if (a && a.id) {
            fid = a.id;
            try {
                sel = [a.selectionStart, a.selectionEnd];
            } catch (error) {}
        }
    }

    render0();


    if (vals) {
        for (const id in vals) {
            const element = $(id);
            if (element) element.value = vals[id];
        }

        const focused = fid && $(fid);

        if (focused) {
            focused.focus();
            try {
                if (sel) focused.setSelectionRange(sel[0], sel[1]);
            } catch (error) {}
        }
    }
}

function render0() {
    $('tabs').innerHTML = tabs.map(([key, label]) =>
        `<button role="tab" aria-selected="${tab === key}" data-t="${key}">${label}</button>`
    ).join('');

    $('view').innerHTML =
        tab === 'in' ? vIn() :
        tab === 'members' ? vMem() :
        tab === 'rep' ? vRep() :
        vPay();
}

$('tabs').onclick = event => {
    const nextTab = event.target.dataset.t;

    if (nextTab) {
        tab = nextTab;
        q = '';
        pend = null;
        pin = null;
        ed = null;
        rest = null;
        otp = null;
        render();
    }
};

/* =========================================
   4. CHECK-IN SCREEN
   ========================================= */

function vIn() {
    const inside = db.visits.filter(v => !v.out);

    const todayN = db.visits.filter(v =>
        v.in && new Date(Number(v.in)).toISOString().slice(0, 10) === today()
    ).length;

    const hits = q
        ? db.members.filter(m =>
            (m.name + m.phone + (m.email || '')).toLowerCase().includes(q.toLowerCase())
        )
        : [];

    return `
        <div class="stat">
            <div><b>${inside.length}</b>inside now</div>
            <div><b>${todayN}</b>visits today</div>
        </div>

        <div class="card">
            <h2>Enter member code</h2>
            <div class="acts">
                <input id="cc" placeholder="Member code" autocomplete="off"
                    autocapitalize="characters" style="flex:1;min-width:140px"
                    onkeydown="if(event.key==='Enter')byCode()">
                <button class="btn" onclick="byCode()">Go</button>
            </div>
            <div class="msg" id="cmsg" role="alert"></div>
            <div id="cok" class="ok" role="status" style="font-weight:600"></div>
        </div>

        <div class="card">
            <h2>Find member</h2>
            <label for="q">Name, phone or email</label>
            <input id="q" value="${esc(q)}" oninput="q=this.value;keep()" autocomplete="off">
            <div id="hits">${hitsHtml(hits)}</div>
        </div>

        <div class="card">
            <h2>Inside now</h2>
            ${inside.length ? inside.map(v => {
                const m = mem(v.mid);
                return m ? `
                    <div class="item">
                        <div>${esc(m.name)}<div class="sub">In at ${fmtT(v.in)}</div></div>
                        <button class="btn" onclick="out('${esc(v.id)}')">Check out</button>
                    </div>` : '';
            }).join('') : '<div class="empty">Nobody is checked in.</div>'}
        </div>

        <div class="card">
            <h2>Today's log</h2>
            ${db.visits.filter(v =>
                v.in && new Date(Number(v.in)).toISOString().slice(0, 10) === today()
            ).slice().reverse().map(v => {
                const m = mem(v.mid);
                return m ? `
                    <div class="item">
                        <span>${esc(m.name)}</span>
                        <span class="sub">${fmtT(v.in)} – ${v.out ? fmtT(v.out) : 'still in'}</span>
                    </div>` : '';
            }).join('') || '<div class="empty">No visits yet today.</div>'}
        </div>`;
}

function hitsHtml(h) {
    if (!q) return '';
    if (!h.length) return '<div class="empty">No match. Add them under Members.</div>';

    return h.map(m => `
        <div class="item">
            <div>
                ${esc(m.name)}
                <div class="sub">${esc(m.phone)}${m.email ? ' · ' + esc(m.email) : ''}</div>
                ${status(m)}
            </div>

            ${open(m)
                ? `<button class="btn alt" onclick="out('${esc(open(m).id)}')">Check out</button>`
                : pin === m.id
                    ? `<div class="acts">
                        <span class="bad">No active payment.</span>
                        <button class="btn" onclick="inn('${esc(m.id)}',true)">Check in anyway</button>
                        <button class="btn alt" onclick="innNo()">Cancel</button>
                       </div>`
                    : otp && otp.mid === m.id
                        ? otpPanel(m)
                        : `<div class="acts">
                            <button class="btn" onclick="inn('${esc(m.id)}')">Check in</button>
                            <button class="btn alt" onclick="startOtp('${esc(m.id)}')">Verify by code</button>
                           </div>`
            }
        </div>
    `).join('');
}

function keep() {
    const hits = q
        ? db.members.filter(m =>
            (m.name + m.phone + (m.email || '')).toLowerCase().includes(q.toLowerCase())
        )
        : [];

    const element = $('hits');
    if (element) element.innerHTML = hitsHtml(hits);
}

function inn(id, force) {
    const m = mem(id);
    if (!m) return;

    if (!active(m) && !force) {
        pin = id;
        keep();
        return;
    }

    pin = null;

    db.visits.push({
        id: uid(),
        mid: id,
        in: Date.now(),
        out: null
    });

    save();
    q = '';
    render();
}

function innNo() {
    pin = null;
    keep();
}

function out(id) {
    const visit = db.visits.find(v => v.id === id);
    if (!visit) return;

    visit.out = Date.now();
    save();
    render();
}

/* =========================================
   5. MEMBERS
   ========================================= */

const contact = m => esc(m.phone) + (m.email ? ' · ' + esc(m.email) : '');

function soonHtml() {
    const t = today();

    const list = db.members
        .filter(m => m.expires && m.expires <= addDays(t, 7))
        .sort((a, b) => a.expires < b.expires ? -1 : 1);

    return list.length
        ? list.map(m => {
            const expired = m.expires < t;
            return `
                <div class="item">
                    <div>${esc(m.name)}<div class="sub">${contact(m)}</div></div>
                    <span class="tag ${expired ? 'bad' : 'ok'}">${expired ? 'Expired ' : 'Ends '}${esc(m.expires)}</span>
                </div>`;
        }).join('')
        : '<div class="empty">Nobody is expired or ending in the next 7 days.</div>';
}

function memList() {
    const list = db.members.filter(m =>
        (m.name + m.phone + (m.email || '')).toLowerCase().includes(ms.toLowerCase().trim())
    );

    if (!db.members.length) return '<div class="empty">No members yet. Add the first one above.</div>';
    if (!list.length) return '<div class="empty">No member matches your search.</div>';

    return list.map(m => {
        if (ed === m.id) {
            return `
                <div class="item" style="display:block">
                    <div class="row">
                        <div><label for="en">Full name</label><input id="en" value="${esc(m.name)}"></div>
                        <div><label for="ep">Phone</label><input id="ep" value="${esc(m.phone)}"></div>
                        <div><label for="ee">Email</label><input id="ee" type="email" value="${esc(m.email || '')}"></div>
                        <div><label for="ex">Paid until</label><input id="ex" type="date" value="${esc(m.expires || '')}"></div>
                    </div>
                    <div class="acts">
                        <button class="btn" onclick="saveE('${esc(m.id)}')">Save</button>
                        <button class="btn alt" onclick="ed=null;render()">Cancel</button>
                    </div>
                    <div class="msg" id="emsg" role="alert"></div>
                </div>`;
        }

        return `
            <div class="item">
                <div>
                    ${esc(m.name)}
                    <div class="sub">${contact(m)}</div>
                    ${status(m)}
                </div>

            <div class="acts">
                ${pend === m.id
                    ? `<span class="sub">Delete ${esc(m.name)}? Payments stay; check-in log is removed.</span>
                       <button class="btn alt danger" onclick="delYes('${esc(m.id)}')">Yes, delete</button>
                       <button class="btn alt" onclick="delNo()">Cancel</button>`
                    : `<button class="btn alt" onclick="ed='${esc(m.id)}';render()">Edit</button>
                       <button class="btn alt danger" onclick="delM('${esc(m.id)}')">Delete</button>`
                }
            </div>


            </div>`;
    }).join('');
}

function vMem() {
    return `
        <div class="card">
            <h2>Add member</h2>
            <div class="row">
                <div><label for="n">Full name</label><input id="n"></div>
                <div><label for="p">Phone</label><input id="p" type="tel"></div>
                <div><label for="e">Email</label><input id="e" type="email" autocomplete="off"></div>
            </div>
            <button class="btn" onclick="addM()">Add member</button>
            <div class="msg" id="msg" role="alert"></div>
        </div>

        ${db.members.some(m => !m.code) ? `
            <div class="card">
                <b>${db.members.filter(m => !m.code).length}</b> member(s) have no check-in code yet.
                <button class="btn" onclick="makeCodes()">Create member codes</button>
            </div>` : ''}

        <div class="card">
            <h2>Expired or ending within 7 days</h2>
            ${soonHtml()}
        </div>

        <div class="card">
            <h2>All members (${db.members.length})</h2>
            <label for="ms">Search</label>
            <input id="ms" value="${esc(ms)}" oninput="ms=this.value;$('ml').innerHTML=memList()" autocomplete="off" style="margin-bottom:8px">
            <div id="ml">${memList()}</div>
        </div>`;
}

function saveE(id) {
    const m = mem(id);
    if (!m) return;

    const n = $('en').value.trim();
    const p = $('ep').value.trim();
    const e = $('ee').value.trim();
    const x = $('ex').value;

    const normalName = value => value.toLowerCase().replace(/\s+/g, ' ').trim();

    if (!n) return fail('en', 'Full name is required.', 'emsg');

    if (db.members.some(o => o.id !== id && normalName(o.name) === normalName(n))) {
        return fail('en', 'Someone already uses the name "' + n + '".', 'emsg');
    }

    if (!p) return fail('ep', 'Phone is required.', 'emsg');
    if (!e) return fail('ee', 'Email is required.', 'emsg');
    if (!/^\S+@\S+\.\S+$/.test(e)) return fail('ee', 'Enter a valid email address.', 'emsg');

    m.name = n;
    m.phone = p;
    m.email = e;
    m.expires = x || null;

    ed = null;
    save();
    render();
}

function backup() {
    const element = $('bk');

    try {
        const content = JSON.stringify(db, null, 2);
        const blob = new Blob([content], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');

        link.href = url;
        link.download = 'gym-desk-backup-' + today() + '.json';

        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);

        element.textContent = 'Backup downloaded.';
    } catch (error) {
        element.textContent = 'Could not create the backup file.';
        console.error(error);
    }
}

function pick(element) {
    const file = element.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = () => {
        try {
            const data = JSON.parse(reader.result);

            for (const key of ['members', 'payments', 'visits']) {
                if (!Array.isArray(data[key])) throw new Error('Invalid backup');
            }

            if (data.plans !== undefined && !Array.isArray(data.plans)) {
                throw new Error('Invalid plans');
            }

            rest = data;

            $('bk').innerHTML = `
                This backup has ${data.members.length} members,
                ${data.payments.length} payments and ${data.visits.length} visits.
                Restoring replaces the current data.
                <button class="btn" onclick="doRest()">Yes, restore</button>
                <button class="btn alt" onclick="rest=null;render()">Cancel</button>`;
        } catch (error) {
            $('bk').textContent = 'That file is not a valid Gym Desk backup.';
        }
    };

    reader.readAsText(file);
}

async function doRest() {
    if (!rest) return;

    const previous = db;

    db = {
        members: rest.members,
        payments: rest.payments,
        visits: rest.visits,
        plans: Array.isArray(rest.plans) ? rest.plans : []
    };

    rest = null;

    await save();
    render();
}

function fail(id, message, box) {
    const output = $(box || 'msg');
    const field = $(id);

    if (output) output.textContent = message;

    if (field) {
        field.setAttribute('aria-invalid', 'true');
        field.focus();
    }

    return false;
}

document.addEventListener('input', event => {
    const target = event.target;

    target.removeAttribute('aria-invalid');

    document.querySelectorAll('.msg').forEach(element => {
        element.textContent = '';
    });

    if (target.id === 'pn' && target.value !== '' && Number(target.value) > 12) {
        fail('pn', 'Months paid can be 12 at most. You entered ' + target.value + '.');
    }
});

function delM(id) {
    pend = id;
    render();
}

function delNo() {
    pend = null;
    render();
}

function delYes(id) {
    const m = mem(id);
    if (!m) return;

    db.payments.forEach(payment => {
        if (payment.mid === id) payment.name = m.name;
    });

    db.visits = db.visits.filter(visit => visit.mid !== id);
    db.members = db.members.filter(member => member.id !== id);

    pend = null;
    save();
    render();
}

function addM() {
    const n = $('n').value.trim();
    const p = $('p').value.trim();
    const e = $('e').value.trim();

    if (!n) return fail('n', 'Full name is required.');

    const normalName = value => value.toLowerCase().replace(/\s+/g, ' ').trim();

    if (db.members.some(m => normalName(m.name) === normalName(n))) {
        return fail('n', 'Someone already uses the name "' + n + '". Use a different name, or add a detail such as a middle initial.');
    }

    if (!p) return fail('p', 'Phone is required.');
    if (!e) return fail('e', 'Email is required.');
    if (!/^\S+@\S+\.\S+$/.test(e)) return fail('e', 'Enter a valid email address.');

    db.members.push({
        id: uid(),
        name: n,
        phone: p,
        email: e,
        code: newCode(),
        expires: null
    });

    save();
    render();
}

/* =========================================
   6. PAYMENTS AND MEMBERSHIP PLANS
   ========================================= */

function vPay() {
    const month = today().slice(0, 7);

    const total = db.payments
        .filter(p => p.date && p.date.slice(0, 7) === month)
        .reduce((sum, p) => sum + Number(p.amount || 0), 0);

    return `
        <div class="stat">
            <div><b>${money(total)}</b>collected this month</div>
            <div><b>${db.members.filter(active).length}</b>active members</div>
        </div>

        <div class="card">
            <h2>Record payment</h2>

            ${db.members.length ? `
                <div class="row">
                    <div>
                        <label for="pm">Member</label>
                        <select id="pm">
                            ${db.members.map(m => `<option value="${esc(m.id)}">${esc(m.name)}</option>`).join('')}
                        </select>
                    </div>

                    <div>
                        <label for="pl">Plan</label>
                        <select id="pl" onchange="usePlan(this.value)">
                            <option value="">Custom</option>
                            ${db.plans.map(p => `<option value="${esc(p.id)}">${esc(p.name)} (${p.months} mo, ${money(p.price)})</option>`).join('')}
                        </select>
                    </div>

                    <div><label for="pa">Amount</label><input id="pa" type="number" min="0"></div>
                    <div><label for="pn">Months paid</label><input id="pn" type="number" min="1" max="12" step="1" value="1"></div>
                    <div><label for="pd">Membership starts</label><input id="pd" type="date" value="${today()}"></div>

                    <div>
                        <label for="py">Method</label>
                        <select id="py">
                            <option>Cash</option>
                            <option>Transfer</option>
                            <option>Card</option>
                        </select>
                    </div>
                </div>

                <button class="btn" onclick="addP()">Save payment</button>
                <div class="msg" id="msg" role="alert"></div>
            ` : '<div class="empty">Add a member first.</div>'}
        </div>

        <div class="card">
            <h2>Plans</h2>

            <div class="row">
                <div><label for="ln">Plan name</label><input id="ln"></div>
                <div><label for="lm">Months (1 to 12)</label><input id="lm" type="number" min="1" max="12" step="1"></div>
                <div><label for="lp">Price</label><input id="lp" type="number" min="0"></div>
            </div>

            <button class="btn" onclick="addPlan()">Add plan</button>
            <div class="msg" id="pmsg" role="alert"></div>

            ${db.plans.length ? db.plans.map(p => `
                <div class="item">
                    <div>
                        ${esc(p.name)}
                        <div class="sub">${p.months} month${p.months > 1 ? 's' : ''} · ${money(p.price)}</div>
                    </div>
                    <button class="btn alt danger" onclick="delPlan('${esc(p.id)}')">Delete</button>
                </div>
            `).join('') : '<div class="empty">No plans yet. Add one to fill in amounts automatically.</div>'}
        </div>

        <div class="card">
            <h2>History</h2>
            ${db.payments.length ? db.payments.slice().reverse().map(p => {
                const m = mem(p.mid);

                return `
                    <div class="item">
                        <div>
                            ${esc(m ? m.name : (p.name ? p.name + ' (deleted)' : 'Deleted member'))}
                            <div class="sub">
                                ${p.plan ? esc(p.plan) + ' · ' : ''}
                                ${esc(p.date || '')} · ${esc(p.method || '')} · ${p.months || 0} mo
                                ${p.from && p.from !== p.date ? ' · starts ' + esc(p.from) : ''}
                            </div>
                        </div>
                        <b>${money(p.amount)}</b>
                    </div>`;
            }).join('') : '<div class="empty">No payments recorded.</div>'}
        </div>`;
}

function usePlan(id) {
    const plan = db.plans.find(p => p.id === id);
    if (!plan) return;

    $('pa').value = plan.price;
    $('pn').value = plan.months;
}

function delPlan(id) {
    db.plans = db.plans.filter(p => p.id !== id);
    save();
    render();
}

function addPlan() {
    const box = 'pmsg';
    const n = $('ln').value.trim();
    const monthText = $('lm').value.trim();
    const months = Number(monthText);
    const priceText = $('lp').value.trim();
    const price = Number(priceText);

    const normalName = value => value.toLowerCase().replace(/\s+/g, ' ').trim();

    if (!n) return fail('ln', 'Plan name is required.', box);

    if (db.plans.some(p => normalName(p.name) === normalName(n))) {
        return fail('ln', 'A plan named "' + n + '" already exists.', box);
    }

    if (monthText === '') return fail('lm', 'Months is required.', box);
    if (!Number.isInteger(months)) return fail('lm', 'Months must be a whole number.', box);
    if (months > 12) return fail('lm', 'Months can be 12 at most. You entered ' + months + '.', box);
    if (months < 1) return fail('lm', 'Months must be at least 1.', box);
    if (priceText === '') return fail('lp', 'Price is required.', box);
    if (!(price > 0)) return fail('lp', 'Price must be more than 0.', box);

    db.plans.push({
        id: uid(),
        name: n,
        months,
        price
    });

    save();
    render();
}

function addP() {
    const amountText = $('pa').value.trim();
    const amount = Number(amountText);

    if (amountText === '') return fail('pa', 'Amount is required.');
    if (!(amount > 0)) return fail('pa', 'Amount must be more than 0.');

    const monthsText = $('pn').value.trim();
    const months = Number(monthsText);

    if (monthsText === '') return fail('pn', 'Months paid is required.');
    if (!Number.isInteger(months)) return fail('pn', 'Months paid must be a whole number.');
    if (months > 12) return fail('pn', 'Months paid can be 12 at most. You entered ' + months + '.');
    if (months < 1) return fail('pn', 'Months paid must be at least 1.');

    const start = $('pd').value;
    if (!start) return fail('pd', 'Start date is required.');

    const m = mem($('pm').value);
    if (!m) return fail('pm', 'Select a valid member.');

    const from = (m.expires && m.expires > start) ? m.expires : start;
    const plan = db.plans.find(p => p.id === $('pl').value);

    m.expires = addMonths(from, months);

    db.payments.push({
        id: uid(),
        mid: m.id,
        name: m.name,
        amount,
        method: $('py').value,
        months,
        date: today(),
        from: start,
        plan: plan ? plan.name : ''
    });

    save();
    render();
}

/* =========================================
   7. REPORTS
   ========================================= */

const MN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

const dkey = timestamp => {
    const d = new Date(Number(timestamp));
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
};

const hr = h => (h % 12 || 12) + ' ' + (h < 12 ? 'AM' : 'PM');

function bars(list, formatter) {
    const max = Math.max(1, ...list.map(x => x.v));

    return list.map(x => `
        <div class="br">
            <span class="sub">${esc(x.l)}</span>
            <div class="bt"><div class="bf" style="width:${x.v / max * 100}%"></div></div>
            <b>${formatter ? formatter(x.v) : x.v}</b>
        </div>
    `).join('');
}

function vRep() {
    const t = today();
    const [year, month] = t.split('-').map(Number);

    const months = [];

    for (let i = 5; i >= 0; i--) {
        const d = new Date(Date.UTC(year, month - 1 - i, 1));
        const key = d.toISOString().slice(0, 7);

        months.push({
            l: MN[d.getUTCMonth()] + ' ' + String(d.getUTCFullYear()).slice(2),
            v: db.payments
                .filter(p => p.date && p.date.slice(0, 7) === key)
                .reduce((sum, p) => sum + Number(p.amount || 0), 0)
        });
    }

    const days = [];

    for (let i = 13; i >= 0; i--) {
        const date = addDays(t, -i);

        days.push({
            l: new Date(date + 'T12:00:00').toLocaleDateString([], {
                weekday: 'short',
                day: 'numeric'
            }),
            v: db.visits.filter(v => v.in && dkey(v.in) === date).length
        });
    }

    const hourlyCounts = Array(24).fill(0);

    db.visits.forEach(v => {
        if (v.in) hourlyCounts[new Date(Number(v.in)).getHours()]++;
    });

    const used = hourlyCounts.map((count, hour) => count ? hour : -1).filter(hour => hour >= 0);

    const hours = used.length
        ? hourlyCounts.map((count, hour) => ({ l: hr(hour), v: count }))
            .slice(used[0], used[used.length - 1] + 1)
        : [];

    const peak = hourlyCounts.indexOf(Math.max(...hourlyCounts));
    const completed = db.visits.filter(v => v.out);

    const average = completed.length
        ? completed.reduce((sum, v) => sum + (Number(v.out) - Number(v.in)), 0) / completed.length / 60000
        : 0;

    const thisMonth = months[5].v;
    const visits14 = days.reduce((sum, day) => sum + day.v, 0);

    return `
        <div class="stat">
            <div><b>${money(thisMonth)}</b>income this month</div>
            <div><b>${visits14}</b>visits, last 14 days</div>
            <div><b>${completed.length ? (average < 60 ? Math.round(average) + ' min' : (average / 60).toFixed(1) + ' h') : '-'}</b>average visit</div>
        </div>

        <div class="card">
            <h2>Income by month</h2>
            ${db.payments.length ? bars(months, money) : '<div class="empty">No payments recorded yet.</div>'}
        </div>

        <div class="card">
            <h2>Visits per day</h2>
            ${db.visits.length ? bars(days) : '<div class="empty">No visits recorded yet.</div>'}
        </div>

        <div class="card">
            <h2>Busiest hours</h2>
            ${hours.length
                ? `<div class="sub" style="margin-bottom:6px">Peak: ${hr(peak)} (${hourlyCounts[peak]} visit${hourlyCounts[peak] > 1 ? 's' : ''}, all time)</div>` + bars(hours)
                : '<div class="empty">No visits recorded yet.</div>'}
        </div>`;
}

/* =========================================
8. MEMBER CHECK-IN CODES
========================================= */

const CH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

const rnd = n => crypto.getRandomValues(new Uint32Array(1))[0] % n;

function newCode() {
let code;


do {
    code = '';
    for (let i = 0; i < 6; i++) {
        code += CH[rnd(CH.length)];
    }
} while (db.members.some(m => m.code === code));

return code;


}

const normCode = value =>
String(value).toUpperCase().replace(/[^A-Z0-9]/g, '');

function makeCodes() {
db.members.forEach(m => {
if (!m.code) m.code = newCode();
});


save();
render();


}

function flash(message) {
const element = $('cok');
if (element) element.textContent = message;


const input = $('cc');
if (input) input.focus();


}

function byCode(source) {
const input = $('cc');
const code = normCode(source || (input ? input.value : ''));


if (!code) {
    return fail('cc', 'Enter a member code.', 'cmsg');
}

const m = db.members.find(member => member.code === code);

if (!m) {
    return fail('cc', 'No member has that code.', 'cmsg');
}

const visit = open(m);

if (visit) {
    out(visit.id);
    flash(m.name + ' checked out.');
    return;
}

if (!active(m)) {
    q = m.name;
    pin = m.id;
    render();
    return;
}

inn(m.id, true);
flash(m.name + ' checked in.');


}


/* =========================================
   9. CHECK-IN VERIFICATION CODE
   ========================================= */

function startOtp(id) {
    otp = {
        mid: id,
        code: String(rnd(1000000)).padStart(6, '0'),
        exp: Date.now() + 300000,
        tries: 0
    };

    keep();
}

function otpPanel(m) {
    const message = 'Your Gym Desk check-in code is ' + otp.code + '. It is valid for 5 minutes.';
    const phone = (m.phone || '').replace(/[^\d+]/g, '');

    const sms = phone
        ? `<a class="btn alt" href="sms:${phone}?&body=${encodeURIComponent(message)}" target="_blank" rel="noopener">Send by SMS</a>`
        : '';

    const email = m.email
        ? `<a class="btn alt" href="mailto:${encodeURIComponent(m.email)}?subject=${encodeURIComponent('Gym check-in code')}&body=${encodeURIComponent(message)}" target="_blank" rel="noopener">Send by email</a>`
        : '';

    return `
        <div style="width:100%">
            <div class="sub">Send the code to ${esc(m.name)}, then enter the 6 digits they read back. Valid 5 minutes.</div>
            <div class="acts" style="margin:8px 0">${sms}${email}</div>
            <div class="acts">
                <input id="oc" inputmode="numeric" maxlength="6" placeholder="6-digit code"
                    autocomplete="off" style="width:150px"
                    onkeydown="if(event.key==='Enter')checkOtp()">
                <button class="btn" onclick="checkOtp()">Verify</button>
                <button class="btn alt" onclick="otp=null;keep()">Cancel</button>
            </div>
            <div class="msg" id="omsg" role="alert"></div>
        </div>`;
}

function otpEnd(message) {
    otp = null;
    keep();

    const hits = $('hits');

    if (hits) {
        const output = document.createElement('div');
        output.className = 'msg';
        output.textContent = message;
        hits.prepend(output);
    }
}

function checkOtp() {
    if (!otp) return;

    const member = mem(otp.mid);
    const value = $('oc').value.trim();

    if (Date.now() > otp.exp) return otpEnd('That code expired. Start again.');
    if (!/^\d{6}$/.test(value)) return fail('oc', 'Enter the 6-digit code.', 'omsg');

    if (value !== otp.code) {
        otp.tries++;

        if (otp.tries >= 3) return otpEnd('Too many wrong codes. Start again.');

        const left = 3 - otp.tries;
        return fail('oc', 'Wrong code. ' + left + ' attempt' + (left > 1 ? 's' : '') + ' left.', 'omsg');
    }

    otp = null;

    const visit = open(member);

    if (visit) {
        out(visit.id);
    } else if (!active(member)) {
        pin = member.id;
        keep();
    } else {
        inn(member.id, true);
    }
}
